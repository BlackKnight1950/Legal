<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set your password · CCH Legal App</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#eef1f6; --paper:#0a0e14; --panel:#111722; --line:#1e2634;
    --line-strong:#2b3547; --brand:#3d8bff; --red:#e5645f; --green:#35c08a; --slate:#8593a6;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Inter",system-ui,sans-serif; color:var(--ink); background:var(--paper);
    min-height:100vh; display:grid; place-items:center; padding:24px;
  }
  .card{
    width:100%; max-width:400px; text-align:center; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:36px 32px 30px;
    box-shadow:0 24px 70px rgba(0,0,0,.5);
  }
  h1{font-family:"Fraunces",serif;font-weight:600;font-size:22px;margin:0 0 6px}
  p.sub{font-size:13px;color:var(--slate);margin:0 0 22px}
  input{
    width:100%;font:inherit;font-size:15px;text-align:center;
    background:#0d1420;color:var(--ink);border:1px solid var(--line-strong);
    border-radius:10px;padding:12px 14px;margin-bottom:12px;
  }
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,139,255,.2)}
  button{
    width:100%;font:inherit;font-size:15px;font-weight:500;cursor:pointer;
    border:1px solid var(--brand);background:var(--brand);color:#fff;
    padding:12px;border-radius:10px;
  }
  button:disabled{opacity:.6;cursor:default}
  .msg{font-size:13px;min-height:18px;margin:14px 0 0}
  .msg.error{color:var(--red)}
  .msg.ok{color:var(--green)}
</style>
</head>
<body>
  <div class="card">
    <h1>Set your password</h1>
    <p class="sub">CCH Legal &amp; Risk Management app</p>
    <input type="password" id="pw1" placeholder="New password (8+ characters)" autocomplete="new-password" />
    <input type="password" id="pw2" placeholder="Confirm password" autocomplete="new-password" />
    <button id="btn" onclick="submitPassword()">Set password</button>
    <p class="msg" id="msg"></p>
  </div>

  <script>window.CCH_API_BASE = "https://legal-7lux.onrender.com";</script>
  <script>
    const API_BASE = (window.CCH_API_BASE || "http://localhost:3000").replace(/\/$/,"");
    const params = new URLSearchParams(location.search);
    const token = params.get("token");
    const msgEl = document.getElementById("msg");

    if (!token) {
      msgEl.textContent = "This link is missing its setup token. Ask an admin to resend your invite.";
      msgEl.className = "msg error";
      document.getElementById("btn").disabled = true;
    }

    async function submitPassword(){
      const pw1 = document.getElementById("pw1").value;
      const pw2 = document.getElementById("pw2").value;
      const btn = document.getElementById("btn");
      if (pw1.length < 8) { msgEl.textContent = "Password must be at least 8 characters."; msgEl.className = "msg error"; return; }
      if (pw1 !== pw2) { msgEl.textContent = "Passwords don't match."; msgEl.className = "msg error"; return; }
      btn.disabled = true; btn.textContent = "Saving…";
      try {
        const res = await fetch(`${API_BASE}/api/auth/set-password`, {
          method: "POST", headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ token, password: pw1 }),
        });
        const data = await res.json().catch(()=>({}));
        if (!res.ok) throw new Error(data.error || `Failed (${res.status})`);
        msgEl.textContent = "Password set. You can sign in now.";
        msgEl.className = "msg ok";
        btn.textContent = "Go to sign in";
        btn.disabled = false;
        btn.onclick = () => location.href = "index.html";
      } catch (e) {
        msgEl.textContent = e.message;
        msgEl.className = "msg error";
        btn.disabled = false; btn.textContent = "Set password";
      }
    }
  </script>
</body>
</html>
